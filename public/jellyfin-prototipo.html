<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTÓTIPO — Jellyfin na sala</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/jellyfin-prototipo.css">
</head>
<body>
  <main class="jp">
    <p class="jp__aviso">PROTÓTIPO descartável. Abra esta página em duas abas ou dois aparelhos com o mesmo <code>#sala</code>.</p>
    <h1>Jellyfin na sala</h1>
    <p id="quem"></p>
    <form id="busca" class="jp__linha">
      <input id="termo" placeholder="Buscar no Jellyfin do host (vazio lista tudo)">
      <button>Buscar</button>
    </form>
    <ul id="itens" class="jp__itens"></ul>
    <video id="player" controls playsinline></video>
    <h2>Estado (vindo do servidor)</h2>
    <pre id="estado">conectando…</pre>
    <h2>Registro</h2>
    <pre id="registro"></pre>
  </main>
  <script type="module" src="/js/jellyfin-prototipo.js"></script>
</body>
</html>
